modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
#logoFile = ".png"
authors = "anbubu"

description='''
provides qol mixins for atm10sky
'''

[[mixins]]
config = "${mod_root}/${mod_parent}/${mod_id}.mixins.megacells.optimisation.json"
requiredMods = ["megacells"]

[[mixins]]
config = "${mod_root}/${mod_parent}/${mod_id}.mixins.titanium.optimisation.json"
requiredMods = ["titanium", "jei"]

[[mixins]]
config = "${mod_root}/${mod_parent}/${mod_id}.mixins.ae2.smithingFix.json"
requiredMods = ["ae2"]

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neo_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "megacells"
    type = "required"
    versionRange = "[4.11.0,4.11.1)"
    ordering = "AFTER"
    side = "BOTH"